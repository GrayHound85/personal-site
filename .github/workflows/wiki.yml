# Publishes docs/wiki/ to this repo's GitHub wiki. The wiki is generated from
# the repo: edit the files in docs/wiki/, not the wiki on GitHub, which is
# overwritten here.
#
# One-time setup: Settings → Features → Wikis, then create any first page in
# the Wiki tab (that creates the wiki's git repo this pushes to).
name: Publish wiki

on:
  push:
    branches:
      - main
    paths:
      - "docs/wiki/**"
      - ".github/workflows/wiki.yml"
  # Lets you publish by hand from the Actions tab (e.g. the first time)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone the wiki
        run: |
          git clone \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git" \
            wiki

      # --delete so pages removed from docs/wiki/ are removed from the wiki too
      - name: Copy docs/wiki into the wiki
        run: rsync -a --delete --exclude .git docs/wiki/ wiki/

      # Commits as whoever pushed, so the wiki's history shows your account
      - name: Commit and push
        working-directory: wiki
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "Wiki is already up to date"
          else
            git commit -m "Update wiki from ${GITHUB_SHA::7}"
            git push
          fi
