# Builds the personal site's Docker image and pushes it to GHCR.
# One workflow per app: the monitoring app will get its own file
# (monitor-site.yml) with its own paths, so each only runs when its code
# or the shared packages change.
name: Personal site

on:
  push:
    branches:
      - main
    paths:
      - "apps/personal-site/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".dockerignore"
      - ".github/workflows/personal-site.yml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Built from the repo root so the image can include packages/ui
      - name: Build and push Docker image
        run: |
          docker build \
            -f apps/personal-site/Dockerfile \
            --build-arg GIT_COMMIT=${{ github.sha }} \
            -t ghcr.io/grayhound85/personal-site:latest \
            .
          docker push ghcr.io/grayhound85/personal-site:latest
